<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de despliegue — APA</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FFF5EE; color: #090201; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 2rem; max-width: 34rem; }
    h1 { font-family: Georgia, serif; font-size: 2rem; margin: 0 0 .5rem; }
    .ok { display: inline-block; background: #E87838; color: #fff; padding: .35rem 1rem; border-radius: 999px; font-weight: 700; margin-bottom: 1rem; }
    p { color: #584D36; line-height: 1.6; }
    code { background: #F1E9DA; padding: .1rem .4rem; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <span class="ok">✓ Funciona</span>
    <h1>Asociación Parasitológica Argentina</h1>
    <p>Si ves esta página, GitHub Pages está publicando el repositorio correctamente.</p>
    <p>Cargada desde: <code id="host"></code></p>
  </main>
  <script>document.getElementById('host').textContent = location.host;</script>
</body>
</html>
