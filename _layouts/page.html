---
layout: default
---

<div class="page-header{% if page.no_divider %} page-header--bare{% endif %}">
  <div class="wrap fade-up">
    {% if page.label %}<div class="section-label">{{ page.label }}</div>{% endif %}
    <h1 class="page-header-title">{{ page.title }}</h1>
    {% if page.description %}<p class="page-header-desc">{{ page.description }}</p>{% endif %}
  </div>
</div>

{{ content }}
